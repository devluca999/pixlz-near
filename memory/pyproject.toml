[project]
name = "pixl-memory"
version = "0.1.0"
description = "Local memory service for Pixl Memory: highlights, drafts, and verified private inference on NEAR AI Cloud TEEs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "dcap-qvl>=0.7.1",
    "eth-account>=0.14.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
pixl-memory = "pixl_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixl_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real NEAR AI Cloud API (needs network; polish tests need NEAR_AI_API_KEY in .env)"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
