<!doctype html>
<meta charset="utf-8">
<title>Pixl e2e · Rich editor</title>
<style>body{font:16px/1.5 system-ui;max-width:680px;margin:48px auto;padding:0 16px}#ed{border:1px solid #bbb;border-radius:8px;padding:14px;min-height:120px}</style>
<h1>Rich editor</h1>
<div id="ed" contenteditable="true"><p>Intro line stays.</p><p id="line">me and him is going to the meting tomorow</p></div>
<p>Input events seen: <b id="count">0</b></p>
<script>
let n = 0;
document.getElementById("ed").addEventListener("input", () => { document.getElementById("count").textContent = ++n; });
if (location.hash === "#select") {
  const ed = document.getElementById("ed"); ed.focus();
  const r = document.createRange(); r.selectNodeContents(document.getElementById("line"));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
</script>
